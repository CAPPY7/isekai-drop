name: CI (analyze + test)

# B1 (0.11.3): one test job for every push to main, every pull request and
# by hand. The platform workflows call this file (workflow_call) and their
# publish jobs wait for it (B2), so nothing reaches latest-build unless the
# same commit passed flutter analyze and flutter test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# No permissions by default; the job only reads the code.
permissions: {}

jobs:
  test:
    name: flutter analyze + flutter test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
