name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default; each job asks only for what it needs.
permissions: {}

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK (versionCode = run number)
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Check APK exists, is not empty, and show signing fingerprint
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          ls -l "$APK"
          sha256sum "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" "isekai-drop-android-${{ github.run_number }}.apk"
      - name: Build smaller arm64-only APK (most modern phones; under 25 MB)
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm64
          --build-number=${{ github.run_number }}
          --android-project-arg=force-version-code-ignoring-abi=true
      - name: Check arm64 APK and signing fingerprint
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          ls -l "$APK"
          sha256sum "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          "$AAPT" dump badging "$APK" | head -1
          cp "$APK" "isekai-drop-android-arm64-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: isekai-drop-android
          path: isekai-drop-android-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: isekai-drop-android-arm64
          path: isekai-drop-android-arm64-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to release "latest-build"
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest-build
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: isekai-drop-android
      - uses: actions/download-artifact@v8.0.2
        with:
          name: isekai-drop-android-arm64
      - run: |
          ls -l *.apk
          test -s isekai-drop-android-${{ github.run_number }}.apk
          test -s isekai-drop-android-arm64-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: latest-build
          name: Latest test build (DEV-signed, not a real release)
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Automatic TEST build of Isekai Drop for Android.
            Run number (versionCode): ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Signed with the throwaway DEV key. Not for public distribution.
            The newest APK has the highest number in its file name.
            "arm64" = smaller file for most phones from about 2017 on. The other file works on all phones.
          files: |
            isekai-drop-android-${{ github.run_number }}.apk
            isekai-drop-android-arm64-${{ github.run_number }}.apk
