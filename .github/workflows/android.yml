name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default; each job asks only for what it needs.
permissions: {}

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  build:
    name: Build signed APK (release key if secrets exist, else dev key)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # RELEASE KEY (0.11.1): if the 4 ISEKAI_RELEASE_* secrets exist, the
      # APKs are signed with the owner's release key. Otherwise (forks, or
      # the secrets were removed) they fall back to the public DEV key with
      # a warning. Secret values are never printed.
      - name: Release key from secrets (falls back to the dev key)
        env:
          KEYSTORE_B64: ${{ secrets.ISEKAI_RELEASE_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.ISEKAI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ISEKAI_RELEASE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ISEKAI_RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEYSTORE_B64 STORE_PW KEY_ALIAS KEY_PW; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning title=DEV-signed build::Release key secrets missing ($missing ). This APK is signed with the PUBLIC dev key - test use only. See docs/RELEASE_SIGNING.md."
            echo "SIGNING_KEY=dev" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"
          echo "ISEKAI_RELEASE_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          echo "SIGNING_KEY=release" >> "$GITHUB_ENV"
          echo "Signing with the release key."
      - name: Build release APK (versionCode = run number)
        env:
          ISEKAI_RELEASE_STORE_PASSWORD: ${{ secrets.ISEKAI_RELEASE_STORE_PASSWORD }}
          ISEKAI_RELEASE_KEY_ALIAS: ${{ secrets.ISEKAI_RELEASE_KEY_ALIAS }}
          ISEKAI_RELEASE_KEY_PASSWORD: ${{ secrets.ISEKAI_RELEASE_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Check APK exists, is not empty, and show signing fingerprint
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          ls -l "$APK"
          sha256sum "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"
          cp "$APK" "isekai-drop-android-${{ github.run_number }}.apk"
      - name: Build smaller arm64-only APK (most modern phones; under 25 MB)
        env:
          ISEKAI_RELEASE_STORE_PASSWORD: ${{ secrets.ISEKAI_RELEASE_STORE_PASSWORD }}
          ISEKAI_RELEASE_KEY_ALIAS: ${{ secrets.ISEKAI_RELEASE_KEY_ALIAS }}
          ISEKAI_RELEASE_KEY_PASSWORD: ${{ secrets.ISEKAI_RELEASE_KEY_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --target-platform android-arm64
          --build-number=${{ github.run_number }}
          --android-project-arg=force-version-code-ignoring-abi=true
      - name: Check arm64 APK and signing fingerprint
        run: |
          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s "$APK"
          ls -l "$APK"
          sha256sum "$APK"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256"
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt
          "$AAPT" dump badging "$APK" | head -1
          cp "$APK" "isekai-drop-android-arm64-${{ github.run_number }}.apk"
      - name: Check which key signed the APKs
        run: |
          DEV=5b36eeb022d11e4c4a9470d4d7cae387407ba238f4bb19c0b2847cefb1b257c1
          REL=8131623f17c711dc42322f2ba9b6426edd298de27f783ffdbd30d04e30a9049b
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in isekai-drop-android-*.apk; do
            d=$("$APKSIGNER" verify --print-certs "$f" | grep -i "certificate SHA-256" | head -1 | awk '{print $NF}')
            echo "$f: $d"
            if [ "$SIGNING_KEY" = release ]; then
              [ "$d" = "$REL" ] || { echo "ERROR: expected the release key"; exit 1; }
            else
              [ "$d" = "$DEV" ] || { echo "ERROR: expected the dev key"; exit 1; }
              echo "::warning title=DEV-signed build::$f is signed with the public dev key."
            fi
          done
          echo "$SIGNING_KEY" > signing-key.txt
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: isekai-drop-android
          path: isekai-drop-android-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: isekai-drop-android-arm64
          path: |
            isekai-drop-android-arm64-${{ github.run_number }}.apk
            signing-key.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to release "latest-build"
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One group per platform: each workflow only touches its own files.
    concurrency:
      group: publish-latest-build-android
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: isekai-drop-android
      - uses: actions/download-artifact@v8.0.2
        with:
          name: isekai-drop-android-arm64
      - name: Stable file names (each build replaces the last)
        run: |
          mv isekai-drop-android-${{ github.run_number }}.apk isekai-drop-android-universal.apk
          mv isekai-drop-android-arm64-${{ github.run_number }}.apk isekai-drop-android-arm64.apk
          test -s isekai-drop-android-universal.apk
          test -s isekai-drop-android-arm64.apk
          ls -l *.apk
          K=$(cat signing-key.txt); rm -f signing-key.txt
          echo "SIGNING_KEY=$K" >> "$GITHUB_ENV"
      - name: Upload (replace) and remove old Android files
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          .github/scripts/latest_build.sh android \
            '^isekai-drop-android-.*\.apk$' \
            "Android ${V} build ${{ github.run_number }} (versionCode ${{ github.run_number }}, ${SIGNING_KEY} key), commit ${GITHUB_SHA::7}" \
            isekai-drop-android-arm64.apk isekai-drop-android-universal.apk
