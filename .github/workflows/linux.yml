name: Linux build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  # B2 (0.11.3): analyze + test for this same commit; publishing waits for it.
  ci:
    name: CI (analyze + test)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --build-number=${{ github.run_number }}
      - name: Pack and check output
        run: |
          tar -czf isekai-drop-linux-x64.tar.gz -C build/linux/x64/release bundle
          test -s isekai-drop-linux-x64.tar.gz
          ls -l isekai-drop-linux-x64.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isekai-drop-linux
          path: isekai-drop-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
