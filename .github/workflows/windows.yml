name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Check output is not empty
        shell: bash
        run: |
          test -s "build/windows/x64/runner/Release/isekaidrop.exe"
          du -sh build/windows/x64/runner/Release
      - name: Show the app's version info (Company / Product / FileVersion)
        shell: pwsh
        run: |
          $v = (Get-Item build/windows/x64/runner/Release/isekaidrop.exe).VersionInfo
          $v | Format-List CompanyName, ProductName, FileDescription, FileVersion, ProductVersion
          if ($v.ProductName -ne 'Isekai Drop') { throw 'ProductName not set' }
      # Inno Setup (build tool only, licence: THIRD_PARTY_NOTICES.md). The
      # runner image normally has Inno Setup 6; install it if missing.
      - name: Build the single-file installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          & $iscc /Qp "/DAppVersion=$ver" "/DBuildNumber=${{ github.run_number }}" `
            "/DSourceDir=$PWD\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\build\installer" windows\installer\isekai-drop.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = Get-Item build\installer\isekai-drop-windows-setup.exe
          if ($setup.Length -lt 1MB) { throw 'installer too small' }
          $setup | Format-List Name, Length
          (Get-FileHash $setup -Algorithm SHA256).Hash
          $setup.VersionInfo | Format-List CompanyName, ProductName, FileVersion, ProductVersion
      # Smoke test on the runner (Windows Server, no Smart App Control):
      # silent per-user install, check files/shortcuts/uninstall entry,
      # then silent uninstall and check it is gone.
      - name: Installer smoke test (silent install + uninstall)
        shell: pwsh
        run: |
          $p = Start-Process build\installer\isekai-drop-windows-setup.exe `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon','/LOG=install.log' `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 30; throw "setup exit $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Isekai Drop'
          $need = @('isekaidrop.exe','flutter_windows.dll','data\icudtl.dat','data\app.so','unins000.exe')
          foreach ($f in $need) { if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" } }
          $src = (Get-ChildItem build\windows\x64\runner\Release -Recurse -File).Count
          $got = (Get-ChildItem $dir -Recurse -File | Where-Object { $_.Name -notlike 'unins000.*' }).Count
          "files: release folder $src, installed $got"
          if ($got -ne $src) { throw 'installed file count differs' }
          $start = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Isekai Drop.lnk'
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Isekai Drop.lnk'
          if (-not (Test-Path $start)) { throw 'no Start menu shortcut' }
          if (-not (Test-Path $desk)) { throw 'no desktop shortcut' }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{7D4B8E2A-3C61-4F0B-9A57-1E2D6C9B4F31}_is1'
          Get-ItemProperty $key | Format-List DisplayName, DisplayVersion, Publisher, InstallLocation, DisplayIcon
          Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'isekaidrop.exe')); $i++) { Start-Sleep 1 }
          if (Test-Path (Join-Path $dir 'isekaidrop.exe')) { throw 'uninstall left the app' }
          if (Test-Path $start) { throw 'uninstall left the Start menu shortcut' }
          if (Test-Path $key) { throw 'uninstall left the registry entry' }
          'install + uninstall OK'
      # The plain folder stays a CI artifact only (not on the release).
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: isekai-drop-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: isekai-drop-windows-setup
          path: build/installer/isekai-drop-windows-setup.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish Windows installer to release "latest-build"
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One group per platform: each workflow only touches its own files.
    concurrency:
      group: publish-latest-build-windows
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: isekai-drop-windows-setup
      - run: |
          test -s isekai-drop-windows-setup.exe
          ls -l isekai-drop-windows-setup.exe
          sha256sum isekai-drop-windows-setup.exe
      # Only the installer goes on the release; the old zip is removed
      # (it matches the Windows pattern and is not uploaded any more).
      - name: Upload (replace) and remove old Windows files
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          .github/scripts/latest_build.sh windows \
            '^isekai-drop-windows-.*$' \
            "Windows x64 installer ${V} build ${{ github.run_number }}, commit ${GITHUB_SHA::7}" \
            isekai-drop-windows-setup.exe
