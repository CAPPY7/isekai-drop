name: iOS UNSIGNED .ipa (needs sideloading)

# Builds an UNSIGNED .ipa. We sign nothing (owner decision 2026-10-16).
# It cannot be installed as is: the owner re-signs it with their own free
# Apple ID using AltStore or Sideloadly. A free Apple ID install expires
# after 7 days. See README "Install on iPhone".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Pack UNSIGNED .ipa and check it is not empty
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry isekai-drop-ios-unsigned-${{ github.run_number }}.ipa Payload
          test -s isekai-drop-ios-unsigned-${{ github.run_number }}.ipa
          ls -l isekai-drop-ios-unsigned-${{ github.run_number }}.ipa
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: isekai-drop-ios-unsigned
          path: isekai-drop-ios-unsigned-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish UNSIGNED .ipa to release "latest-build"
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One group per platform: each workflow only touches its own files.
    concurrency:
      group: publish-latest-build-ios
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: isekai-drop-ios-unsigned
      - name: Stable file name (each build replaces the last)
        run: |
          mv isekai-drop-ios-unsigned-${{ github.run_number }}.ipa isekai-drop-ios-unsigned.ipa
          test -s isekai-drop-ios-unsigned.ipa
          ls -l *.ipa
      - name: Upload (replace) and remove old iOS files
        run: |
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          .github/scripts/latest_build.sh ios \
            '^isekai-drop-ios-.*\.ipa$' \
            "iOS (unsigned) ${V} build ${{ github.run_number }}, commit ${GITHUB_SHA::7}" \
            isekai-drop-ios-unsigned.ipa
