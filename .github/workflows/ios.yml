name: iOS build attempt (UNSIGNED - NOT INSTALLABLE)

# What this CAN do: prove the iOS code compiles on a real macOS runner.
# What this CANNOT do: produce an app you can install on an iPhone.
# Installing needs Apple signing (free 7-day account via Xcode on a Mac,
# or the paid Apple Developer Program for TestFlight). See
# docs/BUILD_AND_INSTALL.md. No signing is set up yet.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Pack UNSIGNED app and check it is not empty
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry isekai-drop-ios-UNSIGNED-not-installable.zip Payload
          test -s isekai-drop-ios-UNSIGNED-not-installable.zip
          ls -l isekai-drop-ios-UNSIGNED-not-installable.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: isekai-drop-ios-UNSIGNED-not-installable
          path: isekai-drop-ios-UNSIGNED-not-installable.zip
          if-no-files-found: error
          retention-days: 14
