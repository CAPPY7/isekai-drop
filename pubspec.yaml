name: isekaidrop
description: "Isekai Drop - private, direct file sharing between your own devices."
publish_to: 'none'

# versionCode/build number is overridden in CI with the GitHub run number.
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  desktop_drop: ^0.8.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#3B5BDB"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
