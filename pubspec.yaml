name: isekaidrop
description: "Isekai Drop - private, direct file sharing between your own devices."
publish_to: 'none'

# versionCode/build number is overridden in CI with the GitHub run number.
version: 0.12.1+15

environment:
  sdk: ^3.13.5

dependencies:
  basic_utils: ^5.8.2
  convert: ^3.1.2
  crypto: ^3.0.8
  desktop_drop: ^0.8.4
  ffi: ^2.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  # E2 (0.12.1): screen texts in English, Hindi and Kannada (official
  # Flutter packages, BSD-3-Clause).
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.2
  mobile_scanner: ^7.5.0
  multicast_dns: ^0.3.3+1
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # E2: generates lib/l10n/app_localizations*.dart from lib/l10n/*.arb.
  generate: true

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#3B5BDB"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
